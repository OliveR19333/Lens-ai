name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend-tests:
    name: Backend domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The pure-logic modules (KMZ builder, flight grid, print scale, county
      # mapping) have no third-party deps, so CI only needs pytest.
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  pwa-build:
    name: PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install
        working-directory: pwa
        run: npm ci || npm install
      - name: Build
        working-directory: pwa
        run: npm run build
